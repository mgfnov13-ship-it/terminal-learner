<div style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1a2233;">
  <p style="font-family: 'SF Mono', 'Courier New', monospace; color: #b08a3e; font-size: 13px; letter-spacing: 0.04em; margin: 0 0 4px;">&gt;_ TERMINAL SPACE</p>
  <h1 style="font-size: 22px; margin: 0 0 16px;">Reset your password</h1>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 24px;">
    Someone requested a password reset for this Terminal Space account. Follow the link below to choose a new
    password.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #d9a44a; color: #14192b; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 6px;">
      Reset password
    </a>
  </p>
  <p style="font-size: 13px; line-height: 1.5; color: #6b7280;">
    If you didn't request this, you can safely ignore this email — your password won't change.
  </p>
</div>
